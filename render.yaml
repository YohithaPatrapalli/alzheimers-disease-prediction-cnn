services:
  - type: web
    name: alzheimers-prediction
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn alzheimers_prediction.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_PATH
        value: /tmp/db.sqlite3
      - key: MEDIA_ROOT
        value: /tmp/alzheimers-data/media
      - key: MODEL_DIRECTORY
        value: /tmp/alzheimers-data/models
      - key: CHECKPOINT_DIRECTORY
        value: /tmp/alzheimers-data/checkpoints
